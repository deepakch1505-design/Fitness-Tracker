{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="heading">
        <h2>{{ exercise_name.replace('-', ' ').title() }}</h2>
        <p>Enter the weight and reps for each set.</p>
    </div>

    <div class="card">

        <form method="POST"
              action="{{ url_for(
                    'exercise',
                    exercise_name=exercise_name,
                    session_id=session_id,
                    exercise_id=exercise_id,
                    muscle_group=muscle_group
              ) }}">

            <label>Weight (kg)</label>

            <input
                type="number"
                name="weight"
                placeholder="Enter weight"
                required
            >

            <label>Reps</label>

            <input
                type="number"
                name="reps"
                placeholder="Enter reps"
                required
            >

            <div class="button-group">

                <button
                    type="submit"
                    name="action"
                    value="add_set">
                    Add Set
                </button>

                <button
                    type="submit"
                    name="action"
                    value="finish">
                    Finish Exercise
                </button>

            </div>

        </form>

    </div>

</div>
{% endblock %}
