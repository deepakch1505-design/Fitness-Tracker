{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="profile-card">

        <h1 class="page-title">
            My Profile
        </h1>


        <form method="POST">

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ user[0] }}">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" value="{{ user[1] }}" readonly>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age" value="{{ user[2] }}">
            </div>

            <div class="form-group">
                <label>Height (cm)</label>
                <input type="number" step="0.1" name="height" value="{{ user[3] }}">
            </div>

            <div class="form-group">
                <label>Weight (kg)</label>
                <input type="number" step="0.1" name="weight" value="{{ user[4] }}">
            </div>

            <div class="form-group">
                <label>Goal</label>

                <select name="goal">

                    <option value="Bulk"
                        {% if user[5]=="Bulk" %}selected{% endif %}>
                        Bulk
                    </option>

                    <option value="Cut"
                        {% if user[5]=="Cut" %}selected{% endif %}>
                        Cut
                    </option>

                    <option value="Maintain"
                        {% if user[5]=="Maintain" %}selected{% endif %}>
                        Maintain
                    </option>

                </select>

            </div>

            <div class="form-group">
                <label>Daily Calorie Goal</label>
                <input
                    type="number"
                    name="calorie_goal"
                    value="{{ user[6] }}">
            </div>

            <div style="text-align:center; margin-top:30px;">
                <button class="btn" type="submit">
                    Save Changes
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
